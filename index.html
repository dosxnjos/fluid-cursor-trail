<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Fluid Cursor Trail — estilo torii.studio</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      /* fundo escuro com leve tom magenta, como o do torii */
      background: #060409;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    /* O CONTÊINER do fluido: fixo, tela cheia, ATRÁS do conteúdo.
       ⚠️ webgl-fluid-enhanced espera um CONTÊINER (div), não um <canvas> — ele cria e
       gerencia o próprio <canvas> interno (100%x100%) e reescreve o `style` do elemento
       que recebe. Passar um <canvas> aqui faz a lib aninhar um canvas dentro de outro
       (o interno nunca é pintado — <canvas> não renderiza filhos).
       ⚠️ A lib também SOBRESCREVE o atributo `style` do contêiner (seta
       `position: relative; display: flex`), o que tira o elemento do fixed e empurra o
       conteúdo abaixo dele na página (dobra a altura do body). `!important` é
       obrigatório aqui — é a única forma de vencer o inline style que ela escreve. */
    #fluid {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw;
      height: 100vh;
      z-index: 0;        /* fica atrás do conteúdo (que tem z-index maior) */
      touch-action: none; /* permite o rastro no mobile sem rolar/zoom a página */
      pointer-events: none; /* o canvas interno não precisa receber cliques */
    }
    #fluid canvas { width: 100% !important; height: 100% !important; display: block !important; }

    /* Conteúdo por cima do contêiner.
       O webgl-fluid-enhanced escuta `mousemove` no canvas INTERNO, não no window — o
       script repassa o ponteiro real (ver comentário no <script> abaixo). */
    .content {
      position: relative;
      z-index: 1;
      pointer-events: none;            /* deixa o cursor atravessar até o canvas */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(24px, 6vw, 96px);
    }
    .content a,
    .content button { pointer-events: auto; } /* só o que é clicável recebe o cursor */

    h1 { font-size: clamp(40px, 8vw, 110px); line-height: 0.95; font-weight: 800; letter-spacing: -0.02em; }
    p  { margin-top: 20px; font-size: clamp(16px, 2.2vw, 22px); opacity: 0.75; max-width: 32ch; }
    .hint { margin-top: 28px; font-size: 14px; opacity: 0.5; }
  </style>
</head>
<body>
  <!-- 1. O contêiner que recebe a simulação (a lib cria o <canvas> interno sozinha) -->
  <div id="fluid"></div>

  <!-- 2. Seu conteúdo normal por cima -->
  <main class="content">
    <h1>Mexe o<br>cursor aqui</h1>
    <p>Cada movimento injeta velocidade e tinta num fluido WebGL rodando na GPU.</p>
    <p class="hint">Efeito: WebGL-Fluid-Simulation (Pavel Dobryakov, MIT) — o mesmo do torii.studio.</p>
  </main>

  <!-- 3. A simulação. Usamos o ESM via CDN pra não depender de bundler.
       Trocar a versão fixa por outra é só mudar a URL (confira a mais recente com
       `npm view webgl-fluid-enhanced version`). -->
  <script type="module">
    import WebGLFluidEnhanced from 'https://esm.run/webgl-fluid-enhanced@0.8.0';

    const wrap = document.getElementById('fluid');

    // Acessibilidade: quem pede menos movimento não recebe a simulação —
    // nem o contêiner é inicializado.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const sim = new WebGLFluidEnhanced(wrap);

      // ---- Config tunada pra ficar parecida com o torii (sutil, escuro, rosa/magenta) ----
      // Nomes camelCase (API do fork) — comentários marcam o que difere do default dele.
      sim.setConfig({
        transparent: true,                // canvas transparente -> compõe sobre o fundo escuro do site
        backgroundColor: '#06040a',       // só usado se transparent for false (deixo por segurança)

        shading: true,                    // (default) iluminação volumétrica — confirmado ligado no torii
        bloom: true,                      // (default) brilho
        bloomIntensity: 0.4,              // de 0.8 -> mais sutil, sem estourar
        bloomThreshold: 0.7,              // de 0.6 -> só os núcleos mais brilhantes brilham
        sunrays: false,                   // god-rays off -> rastro mais limpo

        densityDissipation: 3.5,          // de 1 -> tinta some rápido (rastro curto, não borra a tela)
        velocityDissipation: 0.5,         // de 0.2 -> movimento assenta mais rápido, rastro "cola" no cursor
        curl: 8,                          // de 30 -> bem menos redemoinho; fita suave em vez de caos

        splatRadius: 0.18,                // de 0.25 -> rastro mais fino/delicado
        splatForce: 4500,                 // de 6000 -> injeção mais calma

        colorful: false,                  // desliga o ciclo automático de cores...
        colorPalette: ['#E61A80'],        // ...e fixa rosa/magenta (mesmo tom de r:.9,g:.1,b:.5 do fork antigo)

        simResolution: 96,                // de 128 -> grid de velocidade mais barato
        dyeResolution: 512,               // de 1024 -> metade do custo de GPU, nítido o bastante p/ fundo

        hover: true,                      // (default) rastro segue o cursor ao mover
      });
      sim.start();
      const canvasInterno = wrap.querySelector('canvas');

      // O fork escuta `mousemove` no CANVAS INTERNO que ele mesmo cria — e esse canvas
      // tem pointer-events:none (pra deixar cliques atravessarem até o conteúdo). Por
      // isso o window escuta o ponteiro de verdade e repassa um mousemove sintético pro
      // canvas interno (mesmo padrão do testbed/index.html deste repo).
      window.addEventListener('pointermove', (e) => {
        canvasInterno.dispatchEvent(new MouseEvent('mousemove', { clientX: e.clientX, clientY: e.clientY, bubbles: true }));
        onPointerMove();
      }, { passive: true });

      // Idle-pause: o loop de simulação roda em requestAnimationFrame contínuo e
      // consome GPU/bateria mesmo com o ponteiro parado — pausa após 3s de silêncio
      // e retoma no primeiro movimento seguinte.
      let idleTimer = null;
      let paused = false;
      const IDLE_MS = 3000;
      function armarIdle() {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { sim.stop(); paused = true; }, IDLE_MS);
      }
      function onPointerMove() {
        if (paused) { sim.start(); paused = false; }
        armarIdle();
      }
      armarIdle();
    }

    // Dica: se as cores saírem estranhas, troque colorPalette e deixe colorful: true.
  </script>
</body>
</html>
